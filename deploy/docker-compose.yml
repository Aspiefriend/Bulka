services:
  app:
    build:
      context: ..
      args:
        - VITE_GOOGLE_CLIENT_ID=410066798528-slbtul04234f10pdl2b9j2pk2d3alo01.apps.googleusercontent.com
        - VITE_YMAPS_APIKEY=91e3628f-9adc-49d0-9616-21db7504f79d
        - VITE_GEOCODE_APIKEY=91e3628f-9adc-49d0-9616-21db7504f79d
    env_file:
      - ../.env
    user: "node"
    environment:
      - DB_PATH=/app/data/bulka.db
      - NODE_ENV=production
    volumes:
      - db_data:/app/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db_data:
